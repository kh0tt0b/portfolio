<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Khattab Afifi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/portfolio/assets/images/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Sora', 'Poppins', system-ui, -apple-system, sans-serif;
      background: hsl(0, 0%, 7%);
      color: hsl(0, 0%, 84%);
      text-align: center;
    }
    .wrap { max-width: 420px; }
    .code {
      font-size: clamp(72px, 22vw, 128px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: hsl(38, 96%, 62%);
    }
    h1 {
      margin: 14px 0 8px;
      font-size: 20px;
      font-weight: 600;
      color: hsl(0, 0%, 98%);
    }
    p { font-size: 14px; line-height: 1.6; color: hsla(0, 0%, 84%, 0.7); }
    a.home {
      display: inline-block;
      margin-top: 24px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 500;
      color: hsl(0, 0%, 7%);
      background: hsl(38, 96%, 62%);
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    a.home:hover { transform: translateY(-2px); }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page wandered off</h1>
    <p>The link may be broken, or the page may have moved.</p>
    <a class="home" href="/portfolio/">Back to the portfolio</a>
  </div>
</body>

</html>
